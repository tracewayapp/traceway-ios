name: Release (version + tag)

# Releases the Swift package. SwiftPM resolves versions from git tags, so a
# release is: the tests pass, the version the SDK reports
# (HTTPTransport.version, sent as traceway.sdk.version) and the CHANGELOG
# agree with the tag, then one commit, the tag (plain semver, e.g. 2.1.0, like
# the earlier tags) and a GitHub release with the CHANGELOG section as notes.
#
# Run it on the branch to release from (normally main), after the release
# pull request is merged. "dry_run" runs every check and prints the commit it
# would make, without pushing a commit, a tag or a release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (semver, e.g. 2.1.0 or 2.2.0-beta.1). CHANGELOG.md must have a "## <version>" section.'
        required: true
        type: string
      dry_run:
        description: 'Check only: no commit, no tag, no GitHub release.'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check version and CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the version and the ref
        env:
          VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION': expected semver like 2.1.0 or 2.2.0-beta.1"
            exit 1
          fi
          if [ "$REF_TYPE" != "branch" ]; then
            echo "::error::Run this workflow on a branch (normally main), not on a tag"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null || git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: CHANGELOG has a section for the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! grep -qE "^## $(printf '%s' "$VERSION" | sed 's/[.]/\\./g')( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi

      - name: README installs the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! grep -q "from: \"$VERSION\"" README.md; then
            echo "::warning::README.md's install line does not say from: \"$VERSION\""
          fi

  linux-tests:
    name: Swift tests (Linux)
    needs: check
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test

  apple-build:
    name: Swift tests (macOS) + iOS build
    needs: check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: swift test (host = macOS)
        run: swift test
      - name: Compile for iOS device + simulator
        run: |
          xcodebuild build -scheme Traceway -destination 'generic/platform=iOS'
          xcodebuild build -scheme Traceway -destination 'generic/platform=iOS Simulator'

  release:
    name: Version, tag and GitHub release
    needs: [linux-tests, apple-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set the reported version and date the CHANGELOG section
        env:
          VERSION: ${{ inputs.version }}
        run: |
          FILE=Sources/Traceway/Telemetry/HTTPTransport.swift
          sed -i -E "s/^(    static let version = )\"[^\"]*\"/\1\"$VERSION\"/" "$FILE"
          if ! grep -q "static let version = \"$VERSION\"" "$FILE"; then
            echo "::error::Could not set the version in $FILE"
            exit 1
          fi
          ESCAPED=$(printf '%s' "$VERSION" | sed 's/[.]/\\./g')
          sed -i -E "s/^## $ESCAPED — unreleased$/## $VERSION — $(date -u +%Y-%m-%d)/" CHANGELOG.md
          git diff

      - name: Release notes from the CHANGELOG section
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if ($2 == ver) { found=1; next }
            }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/release_notes.md"
          if [ ! -s "$RUNNER_TEMP/release_notes.md" ]; then
            echo "Release $VERSION" > "$RUNNER_TEMP/release_notes.md"
          fi
          cat "$RUNNER_TEMP/release_notes.md"

      - name: Commit, tag and push
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if ! git diff --quiet; then
            git add Sources/Traceway/Telemetry/HTTPTransport.swift CHANGELOG.md
            git commit -m "$VERSION"
          fi
          git tag "$VERSION"
          git push origin "HEAD:$BRANCH" "$VERSION"

      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          PRERELEASE=""
          [[ "$VERSION" == *"-"* ]] && PRERELEASE="--prerelease"
          gh release create "$VERSION" --title "$VERSION" --notes-file "$RUNNER_TEMP/release_notes.md" $PRERELEASE

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "Version: $VERSION"
            echo
            echo "Dry run: $DRY_RUN"
            echo
            echo "Install: .package(url: \"https://github.com/tracewayapp/traceway-ios.git\", from: \"$VERSION\")"
          } >> "$GITHUB_STEP_SUMMARY"
