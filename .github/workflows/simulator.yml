name: iOS Simulator

on:
  workflow_call:

permissions:
  contents: read

jobs:
  simulator-tests:
    name: XCTest on iOS Simulator
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an available simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+( Pro( Max)?)?' | sort -V | tail -1)
          echo "name=${NAME:-iPhone 16}" >> "$GITHUB_OUTPUT"
          echo "Using simulator: ${NAME:-iPhone 16}"

      # The gallery's `keyboard` scenario records the system keyboard, which
      # the Simulator only shows while no hardware keyboard is connected.
      - name: Use the software keyboard
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

      - name: Run XCTest
        env:
          # Passed to the test process as WIREFRAME_GALLERY_OUT: where the
          # wireframe gallery writes its recording and the app's pictures.
          TEST_RUNNER_WIREFRAME_GALLERY_OUT: ${{ github.workspace }}/wireframe-gallery
        run: |
          xcodebuild test \
            -project TracewayCI.xcodeproj \
            -scheme TracewayCI \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath sim-results.xcresult

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-xcresult
          path: sim-results.xcresult
          if-no-files-found: ignore

      # `python3 CI/wireframe/run.py --gh-run <id>` renders it in
      # rrweb-player and compares every checkpoint with the app's picture.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wireframe-gallery
          path: wireframe-gallery
          if-no-files-found: ignore
